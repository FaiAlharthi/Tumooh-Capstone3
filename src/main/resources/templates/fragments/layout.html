<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${title} ?: 'Tumooh'">Tumooh</title>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tumooh: {
                            navy: '#0B2545',
                            accent: '#00B4A6',
                            light: '#F4F8F7',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        soft: '0 4px 24px -4px rgba(11, 37, 69, 0.12)',
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" th:href="@{/css/tumooh.css}"/>
</head>
<header th:fragment="mainNav(active)" class="border-b border-tumooh-navy/10 bg-white/80 backdrop-blur-md sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-4 sm:py-5 grid grid-cols-[1fr_auto_1fr] items-center gap-2 min-h-[4.5rem] sm:min-h-[5rem]">
        <a th:href="@{/}" class="justify-self-start flex items-center transition-opacity hover:opacity-90">
            <img th:src="@{/logo/Tumooh-logo.png}" alt="Tumooh" class="h-14 sm:h-16 md:h-[4.25rem] w-auto max-w-[min(100%,11rem)]"/>
        </a>
        <nav class="flex items-center justify-center gap-4 sm:gap-8 md:gap-10 text-sm sm:text-base font-medium whitespace-nowrap" aria-label="Main">
            <a th:href="@{/}"
               th:class="${active == 'home'} ? 'text-tumooh-accent' : 'text-tumooh-navy/70 hover:text-tumooh-accent transition-colors'"
               th:attr="aria-current=${active == 'home'} ? 'page' : null">Home</a>
            <a th:href="@{/career}"
               th:class="${active == 'career'} ? 'text-tumooh-accent' : 'text-tumooh-navy/70 hover:text-tumooh-accent transition-colors'"
               th:attr="aria-current=${active == 'career'} ? 'page' : null">Career hub</a>
            <a th:href="@{/ai-tools}"
               th:class="${active == 'ai-tools'} ? 'text-tumooh-accent' : 'text-tumooh-navy/70 hover:text-tumooh-accent transition-colors'"
               th:attr="aria-current=${active == 'ai-tools'} ? 'page' : null">AI<span class="hidden sm:inline"> applicant</span> tools</a>
        </nav>
        <div class="relative justify-self-end">
            <button type="button" id="nav-profile-toggle" aria-haspopup="menu" aria-controls="nav-profile-menu" aria-expanded="false"
                    th:class="'flex items-center gap-1.5 text-sm sm:text-base font-medium transition-colors ' + (${active == 'profile'} ? 'text-tumooh-accent' : 'text-tumooh-navy/70 hover:text-tumooh-accent')">
                <span id="nav-profile-label">Profile</span>
                <svg id="nav-profile-chevron" class="h-3.5 w-3.5 shrink-0 transition-transform" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M5.22 8.22a.75.75 0 0 1 1.06 0L10 11.94l3.72-3.72a.75.75 0 1 1 1.06 1.06l-4.25 4.25a.75.75 0 0 1-1.06 0L5.22 9.28a.75.75 0 0 1 0-1.06Z" clip-rule="evenodd"/>
                </svg>
            </button>

            <div id="nav-profile-menu" role="menu"
                 class="hidden absolute right-0 mt-2 w-64 rounded-2xl bg-white shadow-soft border border-tumooh-navy/10 p-2 z-50">
                <div class="px-3 py-2.5 border-b border-tumooh-navy/5">
                    <p id="nav-profile-name" class="text-sm font-semibold truncate">…</p>
                    <p id="nav-profile-email" class="text-xs text-tumooh-navy/60 truncate"></p>
                </div>
                <a th:href="@{/profile}" role="menuitem" id="nav-profile-link"
                   class="mt-1 flex items-center gap-2 rounded-xl px-3 py-2.5 text-sm font-medium text-tumooh-navy/80 hover:bg-tumooh-accent/10 hover:text-tumooh-accent transition-colors">Profile</a>
            </div>
        </div>
    </div>
    <script th:src="@{/js/nav-profile.js}"></script>
</header>
<body th:fragment="body(content)" class="min-h-screen bg-tumooh-light text-tumooh-navy font-sans antialiased">
<header th:replace="~{fragments/layout :: mainNav(active='home')}"></header>
<main class="max-w-6xl mx-auto px-4 sm:px-6 py-8 sm:py-12">
    <div th:replace="${content}">Content</div>
</main>
<footer class="border-t border-tumooh-navy/10 mt-auto py-8 text-center text-sm text-tumooh-navy/60">
    <p>&copy; <span th:text="${#dates.format(#dates.createNow(), 'yyyy')}">2026</span> Tumooh — Ambition meets opportunity.</p>
</footer>
</body>
</html>
