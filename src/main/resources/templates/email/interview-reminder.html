<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: layout(~{::main})}">
<th:block th:fragment="main">
    <p style="margin:0 0 16px;font-size:15px;line-height:1.65;color:rgba(11,37,69,0.80);">Hello,</p>
    <p style="margin:0 0 24px;font-size:15px;line-height:1.65;color:rgba(11,37,69,0.80);">
        This is a reminder about your upcoming interview scheduled through Tumooh.
    </p>

    <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
           style="margin:0 0 24px;background-color:#ffffff;border:1px solid rgba(11,37,69,0.05);border-radius:16px;overflow:hidden;box-shadow:0 4px 24px -4px rgba(11,37,69,0.12);">
        <tr>
            <td style="padding:16px 20px;background-color:rgba(0,180,166,0.15);border-bottom:1px solid rgba(11,37,69,0.08);">
                <p style="margin:0 0 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:rgba(11,37,69,0.60);">Role</p>
                <p th:text="${jobTitle}" style="margin:0;font-size:18px;font-weight:600;color:#0B2545;">Software Engineer</p>
            </td>
        </tr>
        <tr>
            <td style="padding:16px 20px;border-bottom:1px solid rgba(11,37,69,0.08);">
                <p style="margin:0 0 4px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:rgba(11,37,69,0.60);">Date &amp; time</p>
                <p th:text="${interviewDate}" style="margin:0;font-size:15px;color:rgba(11,37,69,0.80);">—</p>
            </td>
        </tr>
        <tr>
            <td style="padding:16px 20px;background-color:#F4F8F7;">
                <p style="margin:0 0 8px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:rgba(11,37,69,0.60);">Status</p>
                <span th:text="${status}"
                      style="display:inline-block;padding:6px 14px;border-radius:9999px;background-color:#00B4A6;color:#ffffff;font-size:12px;font-weight:600;letter-spacing:0.04em;text-transform:uppercase;">SCHEDULED</span>
            </td>
        </tr>
    </table>

    <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
        <tr>
            <td style="padding:16px 18px;border-left:4px solid #00B4A6;background-color:#F4F8F7;border-radius:0 12px 12px 0;">
                <p style="margin:0;font-size:14px;line-height:1.65;color:rgba(11,37,69,0.80);">
                    Good luck — prepare your introduction and review the job description beforehand.
                </p>
            </td>
        </tr>
    </table>
</th:block>
</html>
