<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Salary benchmark — AI applicant tools')}"></head>
<body class="min-h-screen bg-tumooh-light text-tumooh-navy font-sans antialiased flex flex-col">
<header th:replace="~{fragments/layout :: mainNav(active='ai-tools')}"></header>

<main class="flex-1 max-w-3xl mx-auto w-full px-4 sm:px-6 py-10 space-y-8">
    <div>
        <a th:href="@{/ai-tools}" class="text-sm text-tumooh-navy/60 hover:text-tumooh-accent transition-colors">&larr; AI applicant tools</a>
        <h1 class="mt-2 text-2xl font-bold">Salary benchmark</h1>
        <p class="mt-2 text-tumooh-navy/70">Get an estimated pay range, percentiles, and negotiation tips for a role.</p>
    </div>

    <div class="rounded-2xl bg-white p-6 sm:p-8 shadow-soft border border-tumooh-navy/5">
        <form id="ai-form" class="space-y-5" data-endpoint="/ai/salary-benchmark">
            <div>
                <label for="targetRole" class="block text-sm font-medium mb-2">Target role *</label>
                <input id="targetRole" name="targetRole" type="text" maxlength="100" required
                       placeholder="e.g. Backend Developer"
                       class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
            </div>

            <div>
                <label for="yearsOfExperience" class="block text-sm font-medium mb-2">Years of experience</label>
                <input id="yearsOfExperience" name="yearsOfExperience" type="number" min="0" max="50"
                       placeholder="e.g. 3"
                       class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
            </div>

            <div>
                <label for="city" class="block text-sm font-medium mb-2">City</label>
                <input id="city" name="city" type="text" maxlength="100"
                       placeholder="e.g. Tunis"
                       class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
            </div>

            <div>
                <label for="industry" class="block text-sm font-medium mb-2">Industry</label>
                <input id="industry" name="industry" type="text" maxlength="200"
                       placeholder="e.g. Fintech"
                       class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
            </div>

            <p id="ai-error" class="hidden text-sm text-red-600" role="alert"></p>

            <button type="submit" id="ai-submit"
                    class="w-full rounded-2xl bg-tumooh-accent py-3.5 font-semibold text-white shadow-soft hover:brightness-105 transition-all focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:ring-offset-2">
                Benchmark my salary
            </button>
        </form>
    </div>

    <div id="ai-loading" class="hidden rounded-2xl bg-white p-5 shadow-soft border border-tumooh-navy/5 flex items-center gap-3 text-sm text-tumooh-navy/70">
        <span class="inline-block h-4 w-4 rounded-full border-2 border-tumooh-navy/20 border-t-tumooh-accent animate-spin" aria-hidden="true"></span>
        <span>Checking the market — this can take up to a minute…</span>
    </div>

    <div id="ai-result" class="hidden space-y-4" aria-live="polite"></div>
</main>

<script>window.TUMOOH_AI = { tool: 'salaryBenchmark' };</script>
<script th:src="@{/js/tumooh-api.js}"></script>
<script th:src="@{/js/ai-tools.js}"></script>
</body>
</html>
