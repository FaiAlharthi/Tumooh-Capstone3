<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Profile — Tumooh')}"></head>
<body class="min-h-screen bg-tumooh-light text-tumooh-navy font-sans antialiased flex flex-col">
<header th:replace="~{fragments/layout :: mainNav(active='profile')}"></header>

<main class="flex-1 max-w-3xl mx-auto w-full px-4 sm:px-6 py-10 space-y-8">
    <div>
        <h1 class="text-2xl font-bold">Profile</h1>
        <p class="mt-2 text-tumooh-navy/70">Your applicant profile as teams see it.</p>
    </div>

    <p id="profile-error" class="hidden text-sm text-red-600" role="alert"></p>

    <div id="profile-loading" class="hidden rounded-2xl bg-white p-5 shadow-soft border border-tumooh-navy/5 flex items-center gap-3 text-sm text-tumooh-navy/70">
        <span class="inline-block h-4 w-4 rounded-full border-2 border-tumooh-navy/20 border-t-tumooh-accent animate-spin" aria-hidden="true"></span>
        <span>Loading your profile…</span>
    </div>

    <div id="profile-view" class="hidden space-y-4" aria-live="polite"></div>

    <div id="profile-create" class="hidden rounded-2xl bg-white p-6 sm:p-8 shadow-soft border border-tumooh-navy/5">
        <h2 id="profile-create-title" class="text-lg font-semibold">Create your profile</h2>
        <p id="profile-create-subtitle" class="mt-1 text-sm text-tumooh-navy/70">You don't have a profile yet — it takes a minute.</p>

        <form id="profile-form" class="mt-6 space-y-5">
            <div>
                <label for="fullName" class="block text-sm font-medium mb-2">Full name *</label>
                <input id="fullName" name="fullName" type="text" maxlength="100" required
                       placeholder="e.g. Sara Ahmed"
                       class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
            </div>

            <div class="grid sm:grid-cols-2 gap-5">
                <div>
                    <label for="major" class="block text-sm font-medium mb-2">Major *</label>
                    <input id="major" name="major" type="text" maxlength="100" required
                           placeholder="e.g. Computer Science"
                           class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
                </div>
                <div>
                    <label for="graduationYear" class="block text-sm font-medium mb-2">Graduation year *</label>
                    <input id="graduationYear" name="graduationYear" type="number" min="1950" max="2100" required
                           placeholder="e.g. 2026"
                           class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
                </div>
            </div>

            <div>
                <label for="phoneNumber" class="block text-sm font-medium mb-2">Phone number</label>
                <input id="phoneNumber" name="phoneNumber" type="tel" maxlength="13"
                       pattern="^\+9665[0-9]{8}$"
                       title="Format: +9665XXXXXXXX"
                       placeholder="+966551234567"
                       class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
                <p class="mt-1.5 text-xs text-tumooh-navy/50">Saudi format: +9665XXXXXXXX</p>
            </div>

            <div>
                <label for="bio" class="block text-sm font-medium mb-2">Bio</label>
                <textarea id="bio" name="bio" rows="3" maxlength="500"
                          placeholder="A short summary about you"
                          class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"></textarea>
            </div>

            <div>
                <label for="skills" class="block text-sm font-medium mb-2">Skills</label>
                <textarea id="skills" name="skills" rows="2" maxlength="255"
                          placeholder="e.g. Java, Spring Boot, SQL, Git"
                          class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"></textarea>
            </div>

            <div class="grid sm:grid-cols-2 gap-5">
                <div>
                    <label for="linkedinUrl" class="block text-sm font-medium mb-2">LinkedIn URL</label>
                    <input id="linkedinUrl" name="linkedinUrl" type="url" maxlength="255"
                           placeholder="https://linkedin.com/in/..."
                           class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
                </div>
                <div>
                    <label for="githubUrl" class="block text-sm font-medium mb-2">GitHub URL</label>
                    <input id="githubUrl" name="githubUrl" type="url" maxlength="255"
                           placeholder="https://github.com/..."
                           class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
                </div>
            </div>

            <div class="grid sm:grid-cols-2 gap-5">
                <div>
                    <label for="cvUrl" class="block text-sm font-medium mb-2">CV URL</label>
                    <input id="cvUrl" name="cvUrl" type="text" maxlength="255"
                           placeholder="/uploads/cvs/my-cv.pdf"
                           class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
                </div>
                <div>
                    <label for="profileImage" class="block text-sm font-medium mb-2">Profile image URL</label>
                    <input id="profileImage" name="profileImage" type="text" maxlength="255"
                           placeholder="/images/me.jpg"
                           class="w-full rounded-2xl border border-tumooh-navy/15 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:border-transparent transition-shadow"/>
                </div>
            </div>

            <p id="profile-form-error" class="hidden text-sm text-red-600" role="alert"></p>

            <div class="flex gap-3">
                <button type="submit" id="profile-submit"
                        class="flex-1 rounded-2xl bg-tumooh-accent py-3.5 font-semibold text-white shadow-soft hover:brightness-105 transition-all focus:outline-none focus:ring-2 focus:ring-tumooh-accent focus:ring-offset-2">
                    Save profile
                </button>
                <button type="button" id="profile-cancel"
                        class="hidden rounded-2xl border border-tumooh-navy/15 px-5 py-3.5 font-semibold text-tumooh-navy/70 hover:border-tumooh-accent hover:text-tumooh-accent transition-colors">
                    Cancel
                </button>
            </div>
        </form>
    </div>
</main>

<script th:inline="javascript">
    window.TUMOOH_PROFILE = { userId: /*[[${userId}]]*/ 1 };
</script>
<script th:src="@{/js/tumooh-api.js}"></script>
<script th:src="@{/js/profile.js}"></script>
</body>
</html>
